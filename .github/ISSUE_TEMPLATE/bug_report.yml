name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: prs version
      description: Output of `prs --version`
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and OS
      placeholder: Ghostty on macOS 15
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
