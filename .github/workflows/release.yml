name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: nandatheguntupalli/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - uses: oven-sh/setup-bun@v2

      # every platform's OpenTUI native lib, so each target can be cross-compiled
      - run: bun install --frozen-lockfile --os="*" --cpu="*"

      - run: bun scripts/release.ts
        env:
          GH_TOKEN: ${{ github.token }}
